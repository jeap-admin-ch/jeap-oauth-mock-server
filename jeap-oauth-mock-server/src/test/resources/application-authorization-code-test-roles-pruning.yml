spring:
  application:
    name: test

oauth-mock-data:
  clients:
    - client-id: "introspect-client"
      client-secret: "{noop}secret"

    - client-id: "introspect-client-with-on"
      client-secret: "{noop}secret"
      introspection-endpoint-audience-check: on

    - client-id: "test-client"
      registered-redirect-uri: "http://localhost/redirect"
      context: "USER"
      audience: ["example-resource"]
      scope: ["openid"]
      roles-pruning-enabled: true

    - client-id: "test-client-without-audience"
      registered-redirect-uri: "http://localhost/redirect"
      context: "USER"
      scope: ["openid"]

    - client-id: "test-client-with-audience"
      registered-redirect-uri: "http://localhost/redirect"
      context: "USER"
      audience: ["example-resource", "introspect-client"]
      scope: ["openid"]

  users:
    - id: "user"
      given-name: "Henriette"
      family-name: "Muster"
      locale: "DE"
      preferred-username: "12345"
      ext-id: "56789"
      login-level: "S1+OK"

  roles-pruning-limit: 40
