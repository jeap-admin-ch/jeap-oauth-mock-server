spring:
  application:
    name: test

# Mock server configuration for client credentials flow tests
oauth-mock-data:
  clients:
    - client-id: "test-client"
      client-secret: "{noop}secret"
      subject: "mysubject"
      scope: [ "testscope" ]
      bproles:
        "12345": [ "bprole1", "bprole2" ]
        "23456": ["other-bprole"]
      userroles: [ "testrole", "testrole2"]
      audience: [ "test-audience"]
      roles-pruning-enabled: true

    - client-id: "test-client-bproles-scoped"
      client-secret: "{noop}secret"
      subject: "mysubject"
      bproles:
        "1": [ "bprolea" ]
        "2": [ "bproleb" ]
      userroles: [ "testrole", "testrole2", "testrole3"]
      audience: [ "test-audience"]
      bproles-scope-enabled: true
      roles-pruning-enabled: true

    - client-id: "test-client-without-audience"
      client-secret: "{noop}secret"
      subject: "mysubject"
      bproles:
        "12345": [ "bprole1", "bprole2" ]
        "23456": ["other-bprole"]
      userroles: [ "testrole", "testrole2"]

    - client-id: "test-client-with-audience"
      client-secret: "{noop}secret"
      subject: "mysubject"
      audience: [ "test-audience", "introspect-client", "introspect-client-with-on"]
      bproles:
        "12345": [ "bprole1", "bprole2" ]
        "23456": ["other-bprole"]
      userroles: [ "testrole", "testrole2"]

    - client-id: "introspect-client"
      client-secret: "{noop}secret"

    - client-id: "introspect-client-with-on"
      client-secret: "{noop}secret"
      introspection-endpoint-audience-check: on

  roles-pruning-limit: 40
